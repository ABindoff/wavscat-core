[package]
name = "wavscat-wasm"
description = "WebAssembly bindings for wavscat-core and tapvid: bit-identical scattering and tapping features in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wavscat-core = { path = "../wavscat-core" }
tapvid = { path = "../tapvid" }
# Pinned to the exact version of the wasm-bindgen CLI used to generate the
# JavaScript glue; the two must match.
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
