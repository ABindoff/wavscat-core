[package]
name = "wavscat-py"
description = "Python bindings for wavscat-core and tapvid: bit-identical scattering and tapping features"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "wavscat"
crate-type = ["cdylib"]

[dependencies]
wavscat-core = { path = "../wavscat-core" }
tapvid = { path = "../tapvid", features = ["serde"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
pythonize = "0.29"
