# Every job below checks the same thing from a different machine: that the
# golden cases reproduce the reference record bit for bit. A failure anywhere
# means outputs would differ between platforms.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and ARM64 on each operating system.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Tests, optimised
        run: cargo test --release -p wavscat-core -p tapvid
      - name: Golden record, unoptimised
        run: cargo test -p wavscat-core -p tapvid --test golden
      - name: No platform transcendental functions
        run: cargo clippy -p wavscat-core -p tapvid --all-targets -- -D clippy::disallowed_methods

  wasi:
    name: wasm32-wasip1 under Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the golden test
        run: cargo test --release --target wasm32-wasip1 -p wavscat-core -p tapvid --test golden --no-run
      - name: Run it under WASI
        shell: bash
        run: |
          for w in target/wasm32-wasip1/release/deps/golden-*.wasm; do
            node tools/run-wasi.mjs "$w"
          done
      # WebAssembly SIMD roughly doubles the speed of the dense products. It
      # must not change a bit: each lane does the scalar IEEE operations.
      - name: Build the golden test with SIMD
        env:
          RUSTFLAGS: -C target-feature=+simd128
        run: cargo test --release --target wasm32-wasip1 -p wavscat-core -p tapvid --test golden --no-run --target-dir target/simd
      - name: Run it under WASI, SIMD build
        shell: bash
        run: |
          for w in target/simd/wasm32-wasip1/release/deps/golden-*.wasm; do
            node tools/run-wasi.mjs "$w"
          done

  browsers:
    name: browsers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # WebKit on macOS is the closest CI gets to iOS Safari.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the wasm module
        run: sh tools/build-wasm.sh
      - name: Node tests of the binding
        run: node --test crates/wavscat-wasm/js/test-node.mjs crates/wavscat-wasm/js/test-tapping.mjs
      - name: Install Playwright browsers
        working-directory: crates/wavscat-wasm/js
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: verify() in Chromium, Firefox and WebKit
        working-directory: crates/wavscat-wasm/js
        run: node test-browser.mjs

  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m pip install maturin numpy pytest
          maturin build --release -m crates/wavscat-py/Cargo.toml -o dist
          python -m pip install dist/*.whl
      - name: Python tests, including verify()
        run: python -m pytest -q crates/wavscat-py/tests

  r:
    name: R (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # bash everywhere: in Windows PowerShell, `R` is an alias for Invoke-History.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: The R package's copies of the crates match crates/
        shell: bash
        run: |
          sh tools/sync-r-engine.sh
          git diff --exit-code -- r/wavscatengine/src/rust/crates
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust's GNU target, which R on Windows links with
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install testthat
        run: Rscript -e 'install.packages("testthat")'
      - name: Install wavscatengine
        run: R CMD INSTALL r/wavscatengine
      - name: engine_verify() from R
        run: Rscript -e 'm <- wavscatengine::engine_verify(); if (length(m)) { writeLines(m); quit(status = 1) }'
      - name: Package tests
        run: Rscript -e 'testthat::test_dir("r/wavscatengine/tests/testthat", package = "wavscatengine", stop_on_failure = TRUE)'
