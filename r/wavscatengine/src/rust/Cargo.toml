[package]
name = "wavscatengine"
description = "C interface to wavscat-core for the R package wavscatengine"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
publish = false

# Its own workspace: this crate is built by R CMD INSTALL, not with the rest
# of the repository, and must not be claimed by the workspace above it.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
wavscat-core = { path = "crates/wavscat-core" }

[profile.release]
opt-level = 3
