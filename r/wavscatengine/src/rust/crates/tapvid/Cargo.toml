[package]
name = "tapvid"
description = "Landmark-free finger-tapping features from webcam video, computed identically on every device"
version = "0.1.0-dev"
edition = "2021"
license = "BSD-3-Clause"
publish = false

[dependencies]
wavscat-core = { path = "../wavscat-core" }
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Serialisable trial reports, for the bindings.
serde = ["dep:serde"]
