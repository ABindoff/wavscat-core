# Every transcendental function must come from the pure-Rust `libm` crate, via
# `crate::math`. The std versions call the platform's C library, which differs
# in the last bit between glibc, Apple, MSVC and wasm, and would break the
# bit-for-bit guarantee across targets.
disallowed-methods = [
  { path = "f64::exp", reason = "use crate::math::exp" },
  { path = "f64::exp2", reason = "use crate::math" },
  { path = "f64::exp_m1", reason = "use crate::math" },
  { path = "f64::ln", reason = "use crate::math::ln" },
  { path = "f64::ln_1p", reason = "use crate::math::log1p" },
  { path = "f64::log", reason = "use crate::math" },
  { path = "f64::log2", reason = "use crate::math::log2" },
  { path = "f64::log10", reason = "use crate::math" },
  { path = "f64::powf", reason = "use crate::math::pow" },
  { path = "f64::powi", reason = "use crate::math::pow" },
  { path = "f64::sin", reason = "use crate::math::sin" },
  { path = "f64::cos", reason = "use crate::math::cos" },
  { path = "f64::sin_cos", reason = "use crate::math" },
  { path = "f64::tan", reason = "use crate::math" },
  { path = "f64::hypot", reason = "use crate::math" },
  { path = "f64::cbrt", reason = "use crate::math" },
  { path = "f64::mul_add", reason = "fused multiply-add changes rounding" },
]
